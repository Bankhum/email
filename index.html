<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>ระบบค้นหาอีเมล | โรงเรียนบ้านคุ้ม</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Noto Sans Thai", sans-serif;
      background: #f4f8f5;
      color: #24352a;
    }

    header {
      background: linear-gradient(135deg, #dff5e5, #c9ecd2);
      padding: 32px 20px 28px;
      text-align: center;
      border-bottom: 1px solid #c8dfcf;
    }

    header h1 {
      margin: 0;
      font-size: 30px;
      color: #176b3a;
    }

    header p {
      margin: 8px 0 0;
      color: #567062;
      font-size: 15px;
    }

    .container {
      max-width: 850px;
      margin: 30px auto;
      padding: 0 18px;
    }

    .panel {
      background: #ffffff;
      padding: 20px;
      border-radius: 18px;
      box-shadow: 0 5px 22px rgba(0, 0, 0, 0.08);
    }

    .google-login {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      margin-bottom: 16px;
      padding: 13px 16px;
      border: 1px solid #d7d7d7;
      border-radius: 12px;
      background: #ffffff;
      color: #333333;
      text-decoration: none;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
      transition: 0.2s;
    }

    .google-login:hover {
      background: #f7f7f7;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    .google-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #4285f4;
      color: #ffffff;
      font-weight: bold;
      font-size: 16px;
    }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 18px;
    }

    .tab-btn {
      border: 1px solid #bcdcc6;
      background: #edf8f0;
      color: #23633b;
      padding: 13px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    .tab-btn:hover {
      background: #dff3e5;
    }

    .tab-btn.active {
      background: #198754;
      color: white;
      border-color: #198754;
    }

    .search-input {
      width: 100%;
      padding: 16px 18px;
      border-radius: 13px;
      border: 2px solid #cce5d3;
      font-size: 17px;
      outline: none;
    }

    .search-input:focus {
      border-color: #3d9b60;
    }

    .status {
      margin-top: 12px;
      color: #66756b;
      font-size: 14px;
    }

    .results {
      margin-top: 18px;
    }

    .card {
      background: white;
      margin-bottom: 12px;
      padding: 17px;
      border-radius: 14px;
      box-shadow: 0 3px 14px rgba(0, 0, 0, 0.06);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .info {
      min-width: 0;
    }

    .name {
      font-size: 18px;
      font-weight: bold;
      color: #235b36;
    }

    .email {
      margin-top: 5px;
      color: #555;
      word-break: break-all;
    }

    .copy-btn {
      border: none;
      background: #198754;
      color: white;
      padding: 10px 15px;
      border-radius: 9px;
      cursor: pointer;
      font-size: 14px;
      white-space: nowrap;
    }

    .copy-btn:hover {
      background: #146c43;
    }

    .message {
      text-align: center;
      padding: 34px 20px;
      color: #777;
    }

    footer {
      margin-top: 36px;
      background: #eaf4ed;
      border-top: 1px solid #d1e3d6;
      padding: 24px 18px;
      text-align: center;
      color: #53665a;
      font-size: 13px;
      line-height: 1.8;
    }

    .developer-link {
      color: #245f39;
      font-weight: bold;
      text-decoration: none;
    }

    .developer-link:hover {
      text-decoration: underline;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 24px;
      }

      .card {
        flex-direction: column;
        align-items: stretch;
      }

      .copy-btn {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>🔎 ระบบค้นหาอีเมล</h1>
    <p>โรงเรียนบ้านคุ้ม (ประสารราษฎร์วิทยา)</p>
  </header>

  <div class="container">

    <div class="panel">

      <a
        href="https://accounts.google.com/"
        target="_blank"
        rel="noopener noreferrer"
        class="google-login"
      >
        <span class="google-icon">G</span>
        ลงชื่อเข้าใช้ด้วย Google
      </a>

      <div class="tabs">

        <button
          id="studentTab"
          class="tab-btn active"
          type="button"
        >
          👨‍🎓 นักเรียน
        </button>

        <button
          id="teacherTab"
          class="tab-btn"
          type="button"
        >
          👩‍🏫 ครู
        </button>

      </div>

      <input
        id="search"
        class="search-input"
        type="text"
        placeholder="พิมพ์ชื่อ นามสกุล หรืออีเมล..."
        autocomplete="off"
      />

      <div id="status" class="status">
        กำลังโหลดข้อมูล...
      </div>

    </div>

    <div id="results" class="results">
      <div class="message">
        กำลังโหลดข้อมูล...
      </div>
    </div>

  </div>

  <footer>
    พัฒนาโดย
    <a
      href="https://www.facebook.com/gumzaa.blabla"
      target="_blank"
      rel="noopener noreferrer"
      class="developer-link"
    >
      นายดีลาภ ปราบสงบ
    </a>
    ครูชำนาญการพิเศษ
    <br>

    โรงเรียนบ้านคุ้ม (ประสารราษฎร์วิทยา)
    <br>

    © 2026 โรงเรียนบ้านคุ้ม (ประสารราษฎร์วิทยา) · All rights reserved.
  </footer>

  <script>

    const API =
      "https://script.google.com/macros/s/AKfycbygBOujsdk4pUONGuiU_tqls5u54vo8_MMd9XzmVSEgBH5ar2QEK6pPeyuqSrSCk_YH8Q/exec";

    let currentType = "student";
    let people = [];

    const searchInput =
      document.getElementById("search");

    const status =
      document.getElementById("status");

    const results =
      document.getElementById("results");

    const studentTab =
      document.getElementById("studentTab");

    const teacherTab =
      document.getElementById("teacherTab");


    studentTab.addEventListener("click", () => {
      switchType("student");
    });


    teacherTab.addEventListener("click", () => {
      switchType("teacher");
    });


    function switchType(type) {

      currentType = type;

      studentTab.classList.toggle(
        "active",
        type === "student"
      );

      teacherTab.classList.toggle(
        "active",
        type === "teacher"
      );

      searchInput.value = "";

      loadData();
    }


    async function loadData() {

      status.textContent =
        "กำลังโหลดข้อมูล...";

      results.innerHTML =
        '<div class="message">กำลังโหลดข้อมูล...</div>';

      try {

        const response =
          await fetch(
            API +
            "?type=" +
            encodeURIComponent(currentType)
          );

        const data =
          await response.json();

        if (!data.success) {
          throw new Error(
            data.message ||
            "เกิดข้อผิดพลาด"
          );
        }

        people =
          data.data || [];

        const label =
          currentType === "student"
            ? "นักเรียน"
            : "ครู";

        status.textContent =
          `มีข้อมูล${label} ${people.length} รายการ`;

        results.innerHTML =
          `<div class="message">
            พิมพ์ชื่อหรือนามสกุลเพื่อเริ่มค้นหา
          </div>`;

      } catch (error) {

        console.error(error);

        status.textContent =
          "โหลดข้อมูลไม่สำเร็จ";

        results.innerHTML =
          `<div class="message">
            ❌ เกิดข้อผิดพลาดในการเชื่อมต่อข้อมูล
          </div>`;
      }
    }


    searchInput.addEventListener(
      "input",
      function () {

        const keyword =
          this.value
            .trim()
            .toLowerCase();

        if (!keyword) {

          results.innerHTML =
            `<div class="message">
              พิมพ์ชื่อหรือนามสกุลเพื่อเริ่มค้นหา
            </div>`;

          return;
        }

        const found =
          people.filter(person => {

            const name =
              String(
                person.name || ""
              ).toLowerCase();

            const email =
              String(
                person.email || ""
              ).toLowerCase();

            return (
              name.includes(keyword) ||
              email.includes(keyword)
            );

          });

        showResults(found);
      }
    );


    function showResults(data) {

      if (data.length === 0) {

        results.innerHTML =
          `<div class="message">
            ไม่พบข้อมูล
          </div>`;

        return;
      }

      results.innerHTML =
        data
          .slice(0, 50)
          .map(person => `

            <div class="card">

              <div class="info">

                <div class="name">
                  ${escapeHTML(person.name)}
                </div>

                <div class="email">
                  ${escapeHTML(person.email)}
                </div>

              </div>

              <button
                class="copy-btn"
                data-email="${escapeHTML(person.email)}"
                onclick="copyEmail(this)"
              >
                📋 คัดลอก
              </button>

            </div>

          `)
          .join("");
    }


    async function copyEmail(button) {

      const email =
        button.dataset.email;

      try {

        await navigator.clipboard.writeText(email);

        const oldText =
          button.innerHTML;

        button.innerHTML =
          "✓ คัดลอกแล้ว";

        setTimeout(() => {
          button.innerHTML =
            oldText;
        }, 1300);

      } catch (error) {

        alert(email);

      }
    }


    function escapeHTML(text) {

      const div =
        document.createElement("div");

      div.textContent =
        text || "";

      return div.innerHTML;
    }


    loadData();

  </script>

</body>
</html>
